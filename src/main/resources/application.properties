spring.application.name=homepick

# TiDB / MySQL 연결 설정
spring.datasource.url=jdbc:mysql://${DB_HOST:LOCAL_DB_HOST}:${DB_PORT:LOCAL_DB_PORT}/${DB_DATABASE:LOCAL_DB_DATABASE}?useSSL=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:LOCAL_DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
